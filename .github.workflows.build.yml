name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Generate Android Project Shell
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --org com.secure --project-name apple_finance_tracker --platforms=android
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: 5. Configure Android Manifest & Security Flags
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>

              <application
                  android:label="Wallet Tracker"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:fullBackupContent="false">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver android:name="com.shounakmulay.telephony.sms.IncomingSmsReceiver"
                      android:permission="android.permission.BROADCAST_SMS" android:exported="true">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt")
          cat << 'EOF' > "$MAIN_ACT"
          package com.secure.apple_finance_tracker

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  )
              }
          }
          EOF

      - name: 6. Fix Telephony Plugin Namespace & Set Min SDK
        run: |
          # Inject namespace into another_telephony plugin build.gradle
          PLUGIN_GRADLE=$(find ~/.pub-cache -name "build.gradle" | grep "another_telephony" || true)
          if [ -n "$PLUGIN_GRADLE" ]; then
            echo "Fixing namespace in $PLUGIN_GRADLE"
            sed -i 's/android {/android {\n    namespace "com.shounakmulay.telephony"/g' "$PLUGIN_GRADLE"
          fi

          # Set minimum SDK to 23
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle.kts
          fi

      - name: 7. Install Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 8. Upload Installable APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Tracker-APK-Bundle
          path: build/app/outputs/flutter-apk/app-release.apk

